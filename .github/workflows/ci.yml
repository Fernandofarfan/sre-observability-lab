name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ruff linter
        run: ruff check app/ tests/ scripts/

      - name: Run ruff format check
        run: ruff format --check app/ tests/ scripts/

      - name: Run mypy type checker
        run: mypy app/

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  validate-configs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate Prometheus config and alert rules (promtool)
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.54.1 check config /etc/prometheus/prometheus.yml

      - name: Validate Alertmanager config (amtool)
        run: |
          docker run --rm --entrypoint amtool \
            -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.27.0 check-config /etc/alertmanager/alertmanager.yml

      - name: Validate Grafana dashboard JSON
        run: |
          for f in monitoring/grafana/dashboards/*.json; do
            jq empty "$f"
            echo "OK: $f"
          done

      - name: Validate docker-compose file
        run: |
          cp .env.example .env
          docker compose config -q
          echo "OK: docker-compose.yml"

      - name: Validate Promtail config
        run: |
          mkdir -p /tmp/promtail-positions
          cid=$(docker run -d \
            -v "$PWD/monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp/promtail-positions:/tmp/promtail \
            grafana/promtail:3.1.1 -config.file=/etc/promtail/config.yml)
          sleep 8
          if [ -z "$(docker ps -q --filter id="$cid")" ]; then
            echo "Promtail exited early:"
            docker logs "$cid"
            exit 1
          fi
          docker stop "$cid"
          echo "OK: promtail-config.yml"

      - name: Validate OTel Collector config
        run: |
          cid=$(docker run -d \
            -v "$PWD/monitoring/otel-collector/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.108.0)
          sleep 8
          if [ -z "$(docker ps -q --filter id="$cid")" ]; then
            echo "OTel Collector exited early:"
            docker logs "$cid"
            exit 1
          fi
          docker stop "$cid"
          echo "OK: otel-collector-config.yml"

      - name: Build API Docker image
        run: docker build -t sre-lab-api:ci .

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: validate-configs

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build and start the full stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 240

      - name: Smoke test the stack
        run: |
          set -euo pipefail

          retry() {
            local desc="$1" attempts="$2" delay="$3"
            shift 3
            for i in $(seq 1 "$attempts"); do
              if "$@"; then echo "OK: $desc"; return 0; fi
              echo "waiting for $desc (attempt $i/$attempts)"
              sleep "$delay"
            done
            echo "FAILED: $desc"
            return 1
          }

          check_up() {
            curl -fsSG 'http://localhost:9090/api/v1/query' \
              --data-urlencode 'query=up{job="sre-lab-api"}' \
              | jq -e '.data.result[0].value[1] == "1"' > /dev/null
          }
          check_trace() {
            curl -fsS 'http://localhost:16686/api/services' \
              | jq -e '.data | index("sre-observability-lab") != null' > /dev/null
          }
          check_logs() {
            curl -fsSG 'http://localhost:3100/loki/api/v1/query_range' \
              --data-urlencode 'query={job="sre-observability-lab"}' \
              --data-urlencode "start=$(date -d '10 minutes ago' +%s)000000000" \
              --data-urlencode 'limit=1' \
              | jq -e '.data.result | length > 0' > /dev/null
          }
          check_prometheus_ready() {
            curl -fsS 'http://localhost:9090/-/ready' > /dev/null
          }
          check_grafana_ready() {
            curl -fsS 'http://localhost:3000/api/health' | jq -e '.database == "ok"' > /dev/null
          }
          check_dashboard_provisioned() {
            curl -fsS -u admin:admin 'http://localhost:3000/api/search?query=Alert%20Delivery' \
              | jq -e 'map(.title) | index("SRE Observability Lab - Alert Delivery") != null' > /dev/null
          }
          check_alertmanager_ready() {
            curl -fsS 'http://localhost:9093/-/ready' > /dev/null
          }
          check_loki_ready() {
            curl -fsS 'http://localhost:3100/ready' > /dev/null
          }
          check_alert_delivery_metric() {
            curl -fsSG 'http://localhost:9090/api/v1/query' \
              --data-urlencode 'query=alerts_received_total{job="sre-lab-webhook-receiver",receiver="pager",alertname="other"}' \
              | jq -e '.data.result[0].value[1] | tonumber >= 1' > /dev/null
          }
          check_all_json_logs() {
            local line
            local total=0 bad=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              total=$((total + 1))
              echo "$line" | jq -e . > /dev/null 2>&1 || bad=$((bad + 1))
            done < <(docker compose logs --no-log-prefix --tail 200 "$1" 2>/dev/null)
            [ "$total" -gt 0 ] && [ "$bad" -eq 0 ]
          }
          check_no_tracebacks() {
            local logs
            logs=$(docker compose logs --no-log-prefix --tail 500 api 2>&1)
            if grep -q Traceback <<< "$logs"; then
              echo "FAILED: Traceback found in api logs"
              return 1
            fi
          }
          check_alert_firing() {
            curl -fsSG 'http://localhost:9090/api/v1/query' \
              --data-urlencode 'query=ALERTS{alertname="ErrorBudgetBurnRate_Fast",alertstate="firing"}' \
              | jq -e '.data.result | length > 0' > /dev/null
          }
          check_burn_alert_delivered() {
            curl -fsSG 'http://localhost:9090/api/v1/query' \
              --data-urlencode 'query=alerts_received_total{job="sre-lab-webhook-receiver",receiver="pager",alertname="ErrorBudgetBurnRate_Fast"}' \
              | jq -e '.data.result[0].value[1] | tonumber >= 1' > /dev/null
          }
          check_loki_service_label() {
            curl -fsSG 'http://localhost:3100/loki/api/v1/query_range' \
              --data-urlencode 'query={service=~"api|webhook-receiver"}' \
              --data-urlencode "start=$(date -d '10 minutes ago' +%s)000000000" \
              --data-urlencode 'limit=1' \
              | jq -e '.data.result | length > 0' > /dev/null
          }

          echo "== API =="
          curl -fsS http://localhost:8000/healthz
          echo
          curl -fsS http://localhost:8000/readyz
          echo
          curl -fsS -X POST http://localhost:8000/api/v1/orders \
            -H 'Content-Type: application/json' \
            -d '{"customer_id":"ci-user","items":[{"product_id":"sku-1","quantity":2,"price":4.99}]}'
          echo
          curl -fsSL http://localhost:8000/metrics/ | grep -q '^http_requests_total{'

          echo "== Webhook receiver =="
          curl -fsS http://localhost:9095/healthz
          echo
          curl -fsS -X POST http://localhost:9095/pager \
            -H 'Content-Type: application/json' \
            -d '{"status":"firing","alerts":[{"status":"firing","labels":{"alertname":"E2ESmokeTest","severity":"critical"},"annotations":{"summary":"e2e smoke"}}]}'
          echo

          echo "== Prometheus =="
          retry "prometheus ready" 12 5 check_prometheus_ready
          retry "prometheus scraping api" 24 5 check_up
          retry "alert delivery metric scraped" 24 5 check_alert_delivery_metric

          echo "== Grafana =="
          retry "grafana ready" 12 5 check_grafana_ready
          retry "alert delivery dashboard provisioned" 12 5 check_dashboard_provisioned

          echo "== Alertmanager =="
          retry "alertmanager ready" 12 5 check_alertmanager_ready

          echo "== Loki =="
          retry "loki ready" 12 5 check_loki_ready
          retry "logs ingested into loki" 30 5 check_logs
          retry "service label on logs in loki" 30 5 check_loki_service_label

          echo "== Jaeger =="
          retry "trace exported to jaeger" 30 5 check_trace

          echo "== Structured logs =="
          retry "api logs are all structured JSON" 12 5 check_all_json_logs api
          retry "receiver logs are all structured JSON" 12 5 check_all_json_logs webhook-receiver
          retry "no tracebacks in api logs" 3 5 check_no_tracebacks
          echo "OK: no tracebacks in api logs"

          echo "== Alert firing and delivery =="
          (
            for _ in $(seq 1 180); do
              curl -s -o /dev/null -X POST http://localhost:8000/api/v1/orders \
                -H 'Content-Type: application/json' \
                -d '{"customer_id":"alert-ci","items":[{"product_id":"sku-1","quantity":1,"price":1.00}]}' || true
              sleep 0.5
            done
          ) &
          traffic_pid=$!
          curl -fsS -X POST http://localhost:8000/chaos/errors \
            -H 'Content-Type: application/json' -d '{"enabled":true,"rate":1.0}'
          echo
          retry "fast burn-rate alert firing" 36 10 check_alert_firing
          retry "burn-rate alert delivered to webhook" 18 10 check_burn_alert_delivered
          curl -fsS -X POST http://localhost:8000/chaos/reset
          echo
          kill "$traffic_pid" 2>/dev/null || true
          echo "OK: error budget alert fired, routed and delivered"

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 300

      - name: Tear down
        if: always()
        run: docker compose down -v
