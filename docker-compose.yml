services:
  api:
    build: .
    container_name: sre-lab-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/healthz').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - sre-lab-network

  webhook-receiver:
    build: .
    container_name: sre-lab-webhook-receiver
    command: ["uvicorn", "app.webhook_receiver.main:app", "--host", "0.0.0.0", "--port", "9095", "--workers", "1"]
    ports:
      - "9095:9095"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:9095/healthz').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - sre-lab-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: sre-lab-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sre-lab-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: sre-lab-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/golden_signals.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    restart: unless-stopped
    networks:
      - sre-lab-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: sre-lab-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      webhook-receiver:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sre-lab-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: sre-lab-otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./monitoring/otel-collector/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_started
    restart: unless-stopped
    networks:
      - sre-lab-network

  jaeger:
    image: jaegertracing/all-in-one:1.61
    container_name: sre-lab-jaeger
    ports:
      - "16686:16686"
      - "14250:14250"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
    networks:
      - sre-lab-network

  loki:
    image: grafana/loki:3.1.1
    container_name: sre-lab-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - sre-lab-network

  promtail:
    image: grafana/promtail:3.1.1
    container_name: sre-lab-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp/promtail
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped
    networks:
      - sre-lab-network

volumes:
  prometheus-data:
  grafana-data:
  promtail-positions:

networks:
  sre-lab-network:
    driver: bridge
