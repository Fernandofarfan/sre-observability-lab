global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "sre-lab-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "sre-observability-lab"
          environment: "development"

  - job_name: "sre-lab-webhook-receiver"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["webhook-receiver:9095"]
        labels:
          service: "sre-observability-lab"
          environment: "development"

  - job_name: "sre-lab-promtail"
    static_configs:
      - targets: ["promtail:9080"]
        labels:
          environment: "development"

  - job_name: "sre-lab-alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          environment: "development"

  - job_name: "sre-lab-loki"
    static_configs:
      - targets: ["loki:3100"]
        labels:
          environment: "development"
